<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeshYou | keshyou.com</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col justify-between p-8 md:p-16 selection:bg-pink-500 selection:text-white">

    <!-- Header -->
    <header class="max-w-3xl mx-auto w-full">
        <h1 class="text-4xl md:text-6xl font-black uppercase tracking-wider bg-gradient-to-r from-pink-400 via-purple-400 to-sky-400 bg-clip-text text-transparent">
            KESHYOU
        </h1>
        <p class="text-neutral-400 text-lg md:text-xl font-light mt-4 leading-relaxed">
            Defining the sound of modern Kazakh pop music with energy, style, and iconic vocals.
        </p>
    </header>

    <!-- Content / Writings -->
    <main class="max-w-3xl mx-auto w-full my-12 space-y-8">
        <section class="border-t border-neutral-800 pt-8">
            <h2 class="text-xs uppercase tracking-widest text-neutral-500 font-semibold mb-6">Featured Writings & Releases</h2>
            
            <ul class="space-y-6">
                <li class="border-b border-neutral-900 pb-4 flex justify-between items-baseline">
                    <span class="text-xl font-bold text-neutral-200">Qazaq Qyzy</span>
                    <span class="text-xs font-mono text-neutral-500">Single</span>
                </li>
                <li class="border-b border-neutral-900 pb-4 flex justify-between items-baseline">
                    <span class="text-xl font-bold text-neutral-200">Makhabbat Barlat</span>
                    <span class="text-xs font-mono text-neutral-500">Single</span>
                </li>
                <li class="border-b border-neutral-900 pb-4 flex justify-between items-baseline">
                    <span class="text-xl font-bold text-neutral-200">Keshikpij</span>
                    <span class="text-xs font-mono text-neutral-500">Single</span>
                </li>
            </ul>
        </section>
    </main>

    <!-- Footer -->
    <footer class="max-w-3xl mx-auto w-full border-t border-neutral-900 pt-6 text-xs text-neutral-600">
        <p>&copy; 2026 www.keshyou.com</p>
    </footer>

</body>
</html>
